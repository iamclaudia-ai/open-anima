[install]
# Use exact versions by default
exact = true
# Supply-chain cooling-off period: never install a version published less than
# 3 days ago, so a hijacked release is usually caught and yanked before it lands.
minimumReleaseAge = 259200
# Security fixes too new for the window, exempted by exact version only. Each
# entry can be removed once its version is older than the window.
minimumReleaseAgeExcludes = []

[test]
# Test configuration
coverage = true
# Before any test module loads: drop the shell's ANIMA_* variables, and point
# HOME (and os.homedir()), ANIMA_HOME (config), ANIMA_WATCHDOG_CONFIG,
# ANIMA_DATA_DIR and ANIMA_MEMORY_DIR at temp folders, the config seeded from
# scripts/test-fixtures/. A test run never reads or writes the live ~/.anima
# (it once truncated the agent-host session registry and got running sessions
# reaped) or ~/.claude, and passes on a machine with no config yet.
preload = ["./scripts/test-preload.ts"]

[serve.static]
# Tailwind CSS processing for the gateway's fullstack dev server
plugins = ["bun-plugin-tailwind"]
